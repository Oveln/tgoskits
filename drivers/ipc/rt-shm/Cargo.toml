[package]
name = "rt-shm"
version = "0.1.0"
edition = "2024"
description = "Reusable AMP shared-memory IPC driver core (no_std, OS-independent)"
license = "Apache-2.0"
repository.workspace = true
keywords = ["amp", "ipc", "shared-memory", "no_std", "embedded"]
categories = ["embedded", "no-std", "hardware-support"]

[dependencies]
log = { workspace = true, optional = true }
# ov-channels 提供共享内存通道的 ring-buffer 抽象。
# features 必须与 M-mode 侧（rt-async apps）保持一致：
#   - "flags": SharedMemory 顶部带 busy 标志，影响 struct 布局 —— 双端必须一致
# 0.3.0 起：窗口原子 = core load/store（不再有 critical-section feature，
# portable-atomic 后端已移除）；is_valid 同时校验 magic 与 VERSION(=2)，
# 双端 ov-channels 版本不一致时快速失败。
ov-channels = { version = "0.3", default-features = false, features = ["flags"] }
